services:
  db:
    # Same Postgres 16, plus the pgvector extension for Step 6's semantic search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kalys
      POSTGRES_USER: kalys
      POSTGRES_PASSWORD: kalys
    # Bound to localhost, not 0.0.0.0: nothing outside this machine needs to
    # reach Postgres, and on a public server an open 5432 would be reachable
    # from the internet. The app connects over localhost either way.
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

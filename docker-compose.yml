services:
  db:
    # Same Postgres 16, plus the pgvector extension for Step 6's semantic search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kalys
      POSTGRES_USER: kalys
      POSTGRES_PASSWORD: kalys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
